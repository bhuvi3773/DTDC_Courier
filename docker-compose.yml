version: "3.9"

# Local infrastructure for Book Courier (dev only).
# The backend expects:
#   DATABASE_URL=postgresql://courier:courier@localhost:5432/book_courier
#   REDIS_URL=redis://localhost:6379
services:
  postgres:
    image: postgres:16-alpine
    container_name: courier_pg
    environment:
      POSTGRES_USER: courier
      POSTGRES_PASSWORD: courier
      POSTGRES_DB: book_courier
    ports:
      - "5432:5432"
    volumes:
      - courier_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U courier -d book_courier"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: courier_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  courier_pgdata:
